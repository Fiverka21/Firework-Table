plugins {
    id 'net.minecraftforge.gradle' version '6.0.25'
}

base { archivesName = "${rootProject.archives_base_name}-forge" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: rootProject.minecraft_version
}

sourceSets.main.java.srcDir project(':common').file('src/main/java')
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')

repositories {
    maven { url = 'https://maven.architectury.dev/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    implementation "dev.architectury:architectury-forge:${rootProject.architectury_api_version}"
}

processResources {
    inputs.property 'version', rootProject.mod_version
    filesMatching('META-INF/mods.toml') { expand 'version': rootProject.mod_version }
}
